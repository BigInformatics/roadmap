<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Roadmap</title>
<style>
  :root {
    --bg: #0b0c10;
    --surface: #1f2833;
    --surface-2: #2a3542;
    --ink: #c5c6c7;
    --muted: #8899a6;
    --accent: #66fcf1;
    --accent-dim: #45a29e;
    --danger: #ff6b6b;
    --warning: #feca57;
    --success: #1dd1a1;
    --gold: #feca57;
    --gold-bg: rgba(254, 202, 87, 0.16);
    --border: #2a3542;
    --button-hover-ink: #0b0c10;
    --del-name-bg: rgba(31,40,51,0.75);
    --radius: 6px;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
    --name-col: 240px;
    --month-col: 55px;
    --month-count: 84;
    color-scheme: dark;
  }

  body[data-theme="light"] {
    --bg: #f6f8fb;
    --surface: #ffffff;
    --surface-2: #e9eef5;
    --ink: #18212f;
    --muted: #5d6b7a;
    --accent: #087c78;
    --accent-dim: #0f766e;
    --danger: #b42318;
    --warning: #b7791f;
    --success: #087f5b;
    --gold: #b7791f;
    --gold-bg: rgba(245, 158, 11, 0.16);
    --border: #d7dee8;
    --button-hover-ink: #ffffff;
    --del-name-bg: rgba(255,255,255,0.82);
    --shadow: 0 4px 20px rgba(24,33,47,0.12);
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }

  .brand { display: flex; align-items: center; gap: 0.75rem; min-width: 280px; }
  .brand-dot { width: 12px; height: 12px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 12px var(--accent); flex-shrink: 0; }
  .brand h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
  .brand-subline { color: var(--muted); font-size: 0.875rem; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .last-updated { color: var(--gold); font-size: 0.75rem; }

  .controls { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .utility-controls { margin-left: auto; display: inline-flex; gap: 0.45rem; align-items: center; }
  .search-box { min-width: 220px; max-width: 320px; }
  .date-select { min-width: 120px; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; }
  .btn.icon-only { width: 38px; padding: 0.5rem; }
  .btn.icon-only .btn-label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .icon-btn svg { width: 1rem; height: 1rem; display: block; flex-shrink: 0; }
  #btnCopyMarkdown { color: var(--accent); }
  #btnNow { color: var(--gold); }
  #btnEdit { color: var(--success); }
  #btnCopyMarkdown:hover, #btnNow:hover, #btnEdit:hover,
  #btnCopyMarkdown.active, #btnNow.active, #btnEdit.active { color: var(--button-hover-ink); }
  .filter-chip { color: var(--success); border-color: rgba(29,209,161,0.35); background: rgba(29,209,161,0.08); display: inline-flex; align-items: center; }
  .filter-chip.active { border-color: var(--success); }
  .btn, select.btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 0.5rem 1rem;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 0.875rem;
    transition: all 0.15s;
    white-space: nowrap;
    min-height: 38px;
  }
  .btn:hover { background: var(--accent-dim); color: var(--button-hover-ink); border-color: var(--accent-dim); }
  .btn.active { background: var(--accent); color: var(--button-hover-ink); border-color: var(--accent); font-weight: 600; }
  .btn:disabled, .btn[aria-disabled="true"] { cursor: not-allowed; opacity: 0.38; filter: grayscale(0.35); }
  .btn:disabled:hover, .btn[aria-disabled="true"]:hover { background: var(--surface-2); color: var(--ink); border-color: var(--border); }
  body[data-theme="light"] #btnTagSearch:not(.active):hover,
  body[data-theme="light"] #btnFavoritesOnly:not(.active):hover {
    background: var(--surface-2);
    color: var(--ink);
    border-color: var(--border);
  }
  .btn.danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.small { padding: 0.35rem 0.65rem; font-size: 0.75rem; min-height: 30px; }
  .btn.ghost { background: transparent; }
  .theme-toggle { display: inline-flex; align-items: center; gap: 0.4rem; }
  .theme-toggle svg { width: 1rem; height: 1rem; display: block; }

  .main { padding: 2rem; max-width: 100%; margin: 0 auto; }
  .build-footer { padding: 0 2rem 2rem; color: var(--muted); font-size: 0.74rem; text-align: right; }
  .build-footer time { color: var(--ink); }
  .product-toggle-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; max-width: 1600px; align-items: center; }
  .toggle-pill { display: inline-flex; align-items: center; gap: 0.45rem; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 0.4rem 0.75rem; font-size: 0.8rem; cursor: pointer; color: var(--muted); }
  .toggle-pill input { width: auto; accent-color: var(--accent); }
  .toggle-pill.enabled { color: var(--ink); border-color: rgba(102,252,241,0.35); background: rgba(102,252,241,0.07); }
  .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 2rem; max-width: 1600px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; text-align: center; }
  .stat-value { font-size: 1.75rem; font-weight: 700; }
  .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.25rem; }

  .roadmap-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; box-shadow: var(--shadow); }
  .linear-wrap { overflow-x: hidden; }
  .linear-wrap .timeline-header { display: block; min-width: 100%; }
  .linear-wrap .linear-header, .linear-wrap .linear-row { width: 100%; min-width: 0; box-sizing: border-box; }
  .linear-header, .linear-row { display: grid; grid-template-columns: 10px minmax(180px, 1.1fr) minmax(260px, 2fr) minmax(180px, 1fr) minmax(150px, 0.8fr) minmax(86px, auto); gap: 1rem; align-items: center; }
  .linear-header { position: sticky; top: 0; z-index: 50; background: var(--surface-2); border-bottom: 1px solid var(--border); padding: 0.75rem 1rem; color: var(--muted); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .linear-row { min-height: 64px; border: 0; border-bottom: 1px solid var(--border); padding: 0.8rem 1rem; text-align: left; color: var(--ink); cursor: pointer; transition: transform 0.15s, filter 0.15s, background 0.15s; }
  .linear-product-bar { width: 10px; align-self: stretch; min-height: 44px; border-radius: 999px; background: var(--product-color, var(--accent)); box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 0 12px color-mix(in srgb, var(--product-color, var(--accent)) 35%, transparent); }
  .linear-row:hover { filter: brightness(1.15); transform: translateX(2px); }
  .linear-row.current-week { box-shadow: inset 4px 0 0 var(--gold), inset 0 0 0 1px rgba(254,202,87,0.35); background: var(--gold-bg); }
  .linear-row.current-week .linear-date { color: var(--gold); }
  .linear-date { font-weight: 700; color: var(--ink); }
  .linear-week-label { display: block; color: var(--gold); font-size: 0.7rem; font-weight: 700; margin-top: 0.2rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .linear-task { font-weight: 600; display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
  .linear-meta { color: var(--muted); font-size: 0.78rem; margin-top: 0.18rem; }
  .linear-contract { color: var(--ink); font-size: 0.88rem; }
  .linear-status { justify-self: start; border: 1px solid; border-radius: 999px; padding: 0.25rem 0.55rem; font-size: 0.76rem; font-weight: 700; }
  .quick-status-actions { display: inline-flex; gap: 0.35rem; align-items: center; justify-content: flex-end; }
  .quick-status-btn { width: 30px; min-height: 30px; padding: 0; border-radius: 999px; font-weight: 800; line-height: 1; }
  .quick-status-btn.complete { color: var(--success); border-color: rgba(29,209,161,0.35); }
  .quick-status-btn.review { color: #be185d; border-color: rgba(244,114,182,0.5); background: rgba(255, 214, 231, 0.55); }
  .d3-wrap { overflow-x: hidden; }
  .d3-wrap .timeline-header { display: block; min-width: 100%; }
  .d3-timeline-toolbar { display: flex; justify-content: space-between; gap: 1rem; align-items: center; padding: 0.75rem 1rem; background: var(--surface-2); border-bottom: 1px solid var(--border); color: var(--muted); font-size: 0.78rem; }
  .d3-timeline-title { color: var(--ink); font-weight: 700; }
  .d3-timeline-actions { display: inline-flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .timeline-scroll-canvas { overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; }
  .d3-timeline-canvas { padding: 1rem; min-height: 320px; }
  .d3-timeline-svg { width: 100%; min-height: 320px; display: block; overflow: visible; }
  .timeline-axis line, .timeline-axis path { stroke: var(--border); }
  .timeline-axis text { fill: var(--muted); font-size: 0.72rem; }
  .timeline-lane-line { stroke: var(--border); stroke-width: 1; stroke-dasharray: 4 5; }
  .timeline-group-label { fill: var(--muted); font-size: 0.76rem; font-weight: 700; }
  .timeline-node { cursor: pointer; transition: opacity 0.15s, transform 0.15s; }
  .timeline-node:hover { opacity: 0.85; }
  .timeline-node-dot { stroke: var(--surface); stroke-width: 3; filter: drop-shadow(0 2px 7px rgba(0,0,0,0.35)); }
  .timeline-node-card { fill: var(--surface-2); stroke: var(--border); rx: 8; }
  .timeline-node-title { fill: var(--ink); font-size: 0.74rem; font-weight: 700; }
  .timeline-node-meta { fill: var(--muted); font-size: 0.66rem; }
  .timeline-today { stroke: var(--gold); stroke-width: 2; stroke-dasharray: 6 5; }
  .timeline-empty { padding: 2rem; color: var(--muted); }
  .timeline-header, .swimlane-header, .deliverable-row { min-width: calc(var(--name-col) + (var(--month-col) * var(--month-count))); }
  .timeline-header { display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 50; }
  .th-cell { flex-shrink: 0; padding: 0.4rem 0.2rem; font: inherit; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); background: transparent; border: 0; border-right: 1px solid var(--border); text-align: center; line-height: 1.3; }
  .th-cell:first-child { width: var(--name-col); text-align: left; padding: 0.75rem 1rem; font-size: 0.75rem; border-left: none; display: flex; align-items: center; }
  .th-cell:not(:first-child) { width: var(--month-col); }
  .th-cell.current-month { background: var(--gold-bg); color: var(--gold); box-shadow: inset 0 0 0 1px rgba(254,202,87,0.35); }
  .th-cell.month-selectable { cursor: pointer; user-select: none; }
  .th-cell.month-selectable:hover { background: rgba(29,209,161,0.08); color: var(--success); }
  .th-cell.selected-month, .cell.selected-month { background: rgba(29,209,161,0.14); box-shadow: inset 0 0 0 1px rgba(29,209,161,0.35); }
  .th-cell.selected-month { color: var(--success); }
  .th-cell .year-tag { font-size: 0.55rem; color: inherit; display: block; margin-top: 1px; }

  .swimlane { border-bottom: 1px solid var(--border); }
  .swimlane:last-child { border-bottom: none; }
  .swimlane-header { display: flex; background: var(--surface-2); border-bottom: 1px solid var(--border); position: relative; }
  .product-name { width: var(--name-col); flex-shrink: 0; padding: 0.75rem 1rem; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; border-right: 1px solid var(--border); }
  .product-meta { font-weight: 400; font-size: 0.75rem; color: var(--muted); margin-left: auto; }
  .product-bar { padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .progress-mini { height: 6px; background: var(--bg); border-radius: 3px; width: 120px; overflow: hidden; }
  .progress-mini-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }
  .empty-state { padding: 2rem; color: var(--muted); }
  .empty-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; padding: 2rem; }
  .empty-action-btn { display: flex; min-height: 150px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0.65rem; text-align: left; font-size: 1rem; border-style: dashed; }
  .empty-action-btn strong { color: var(--ink); font-size: 1.2rem; }
  .empty-action-btn span { color: var(--muted); white-space: normal; }
  .swimlane.collapsed .deliverable-row { display: none; }
  .product-collapse-btn { width: 2rem; min-height: 2rem; padding: 0; font-size: 1.25rem; line-height: 1; font-weight: 700; flex-shrink: 0; }

  .deliverable-row { display: flex; border-bottom: 1px solid var(--border); transition: background 0.15s; position: relative; }
  .deliverable-row:hover { background: rgba(102, 252, 241, 0.03); }
  .del-name { width: var(--name-col); flex-shrink: 0; padding: 0.5rem 1rem; font-size: 0.8rem; border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; gap: 0.15rem; background: var(--del-name-bg); z-index: 2; }
  .del-title-row { display: flex; align-items: center; gap: 0.35rem; min-width: 0; }
  .del-name .title { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .del-name .owner { font-size: 0.7rem; color: var(--muted); }
  .favorite-toggle { appearance: none; background: transparent; border: 0; color: #bababa; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; width: 1.1rem; height: 1.1rem; flex-shrink: 0; opacity: 0.5; }
  .favorite-toggle svg { width: 1rem; height: 1rem; display: block; stroke: currentColor; }
  .favorite-toggle.active { color: #e0a500; opacity: 1; }
  .favorite-toggle.active svg { fill: rgba(224,165,0,0.28); stroke: currentColor; }
  .favorite-toggle:hover { color: #e0a500; opacity: 1; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.1rem; }
  .tag-pill { display: inline-flex; align-items: center; gap: 0.2rem; border: 1px solid rgba(0,189,126,0.35); color: var(--success); background: rgba(0,189,126,0.08); border-radius: 999px; padding: 0.1rem 0.38rem; font-size: 0.66rem; line-height: 1.2; }
  .tag-pill svg, .tag-icon svg { width: 0.72rem; height: 0.72rem; display: block; flex-shrink: 0; }
  .chip-meta-icons { display: inline-flex; align-items: center; gap: 0.18rem; margin-left: 0.2rem; vertical-align: middle; }
  .cell { width: var(--month-col); flex-shrink: 0; border-right: 1px solid var(--border); position: relative; min-height: 42px; padding: 3px; }
  .cell.current-month { background: var(--gold-bg); box-shadow: inset 0 0 0 1px rgba(254,202,87,0.2); }

  .due-chip { display: flex; align-items: center; justify-content: center; gap: 0.15rem; width: 100%; padding: 0.18rem 0.25rem; margin-bottom: 2px; border-radius: 4px; font-size: 0.58rem; line-height: 1.1; cursor: pointer; overflow: hidden; text-overflow: ellipsis; position: relative; z-index: 4; }
  .due-chip:hover { filter: brightness(1.25); overflow: visible; white-space: normal; z-index: 25; position: relative; }
  .due-chip-wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px; align-items: start; margin-bottom: 2px; }
  .due-chip-wrap .due-chip { margin-bottom: 0; }
  .cell-quick-actions { display: inline-flex; flex-direction: column; gap: 2px; }
  .cell-quick-actions .quick-status-btn { width: 16px; min-height: 16px; font-size: 0.58rem; border-radius: 4px; }
  .note-icon { display: inline-flex; align-items: center; justify-content: center; color: #bababa; flex-shrink: 0; vertical-align: text-bottom; }
  .note-icon svg { width: 0.9em; height: 0.9em; display: block; }
  .due-chip .note-icon { font-size: 0.8rem; }
  .linear-date-wrap { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
  .linear-date-wrap .note-icon { font-size: 1rem; }

  .status-not-started { background: rgba(136, 153, 166, 0.15); color: var(--muted); border-color: rgba(136,153,166,0.3); }
  .status-in-progress { background: rgba(102, 252, 241, 0.12); color: var(--accent); border-color: rgba(102,252,241,0.3); }
  .status-at-risk { background: rgba(255, 107, 107, 0.12); color: var(--danger); border-color: rgba(255,107,107,0.3); }
  .status-review { background: #ffd6e7; color: #7a1f45; border-color: rgba(244,114,182,0.75); }
  .status-completed { background: rgba(29, 209, 161, 0.12); color: var(--success); border-color: rgba(29,209,161,0.3); }
  .status-blocked, .status-on-hold { background: rgba(255, 107, 107, 0.08); color: var(--danger); border-color: rgba(255,107,107,0.2); border-style: dashed; }
  .status-cancelled { background: rgba(136, 153, 166, 0.08); color: var(--muted); border-color: rgba(136,153,166,0.22); border-style: dashed; text-decoration: line-through; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; margin-right: 0.1rem; flex-shrink: 0; }
  .status-dot.not-started { background: var(--muted); }
  .status-dot.in-progress { background: var(--accent); box-shadow: 0 0 4px var(--accent); }
  .status-dot.at-risk { background: var(--danger); box-shadow: 0 0 4px var(--danger); }
  .status-dot.review { background: #f472b6; box-shadow: 0 0 4px #f472b6; }
  .status-dot.completed { background: var(--success); }
  .status-dot.blocked, .status-dot.on-hold { background: var(--danger); opacity: 0.6; }
  .status-dot.cancelled { background: var(--muted); opacity: 0.5; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .detail-panel { position: fixed; right: -680px; top: 0; width: 660px; max-width: 100%; height: 100vh; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow); z-index: 200; transition: right 0.25s ease; overflow-y: auto; padding: 1.5rem; }
  .detail-panel.open { right: 0; }
  .panel-header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .panel-header h2 { font-size: 1.1rem; font-weight: 600; }
  .close-btn { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; line-height: 1; }
  .close-btn:hover { color: var(--ink); }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.75rem; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; letter-spacing: 0.03em; }
  .field .toggle-pill { display: inline-flex; text-transform: none; letter-spacing: 0; margin-bottom: 0; }
  .field .value { font-size: 0.9rem; }
  .editable, textarea, input { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.5rem; width: 100%; color: var(--ink); font-family: inherit; font-size: 0.85rem; resize: vertical; }
  textarea.editable { min-height: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  .status-buttons { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0 1rem; }
  .notes-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
  .notes-list li { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.5rem; font-size: 0.8rem; color: var(--muted); }
  .action-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
  .action-list li { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.65rem; font-size: 0.82rem; color: var(--muted); }
  .action-list strong { display: block; color: var(--ink); font-size: 0.86rem; margin-bottom: 0.15rem; }
  .action-timestamp { display: block; color: var(--gold); font-size: 0.72rem; margin-top: 0.25rem; }
  .due-summary { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.6rem; }
  .due-summary.empty { color: var(--muted); font-size: 0.85rem; }
  .due-count { color: var(--muted); font-size: 0.78rem; margin-bottom: 0.45rem; }
  .due-pill-grid { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .due-date-pill { display: inline-flex; align-items: center; min-height: 24px; padding: 0.2rem 0.45rem; border: 1px solid; border-radius: 999px; font-size: 0.76rem; line-height: 1; cursor: pointer; }
  .due-date-pill.active { outline: 2px solid var(--accent); outline-offset: 2px; }
  .due-note { margin-left: 0.3rem; }
  .due-more { margin-top: 0.5rem; }
  .due-more summary { color: var(--accent); cursor: pointer; font-size: 0.8rem; }

  const lines = [

function canvasCssColor(name, fallback) {
  const bodyValue = getComputedStyle(document.body).getPropertyValue(name).trim();
  const rootValue = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return bodyValue || rootValue || fallback;
}
function wrapCanvasText(ctx, text, maxWidth, maxLines = 2) {
  const words = String(text || '').split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  words.forEach(word => {
    const next = line ? `${line} ${word}` : word;
    if (ctx.measureText(next).width <= maxWidth || !line) line = next;
    else { lines.push(line); line = word; }
  });
  if (line) lines.push(line);
  if (lines.length > maxLines) {
    const kept = lines.slice(0, maxLines);
    kept[maxLines - 1] = kept[maxLines - 1].replace(/\s+\S*$/, '') + '…';
    return kept;
  }
  return lines;
}
function drawRoundRect(ctx, x, y, width, height, radius) {
  const r = Math.min(radius, width / 2, height / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + width, y, x + width, y + height, r);
  ctx.arcTo(x + width, y + height, x, y + height, r);
  ctx.arcTo(x, y + height, x, y, r);
  ctx.arcTo(x, y, x + width, y, r);
  ctx.closePath();
}
function downloadMatrixScreenshot() {
  if (currentView !== 'matrix') return;
  const items = collectMatrixItems(enabledDocuments(), { hideRoutine: matrixHideRoutine, strictMode: matrixStrictMode });
  if (!enabledDocuments().length || !items.length) { alert('No matrix items are available to export.'); return; }
  const phases = buildMatrixPhases(items, { phaseMode: matrixPhaseMode });
  const groups = groupMatrixItems(items, phases);
  const workstreamWidth = 240;
  const phaseWidth = 300;
  const headerHeight = 112;
  const baseRowHeight = 172;
  const rowHeights = groups.map(group => Math.max(baseRowHeight, ...phases.map(phase => 74 + groupMatrixCellItems(group.phases.get(phase.label) || []).length * 62)));
  const width = workstreamWidth + (phaseWidth * phases.length);
  const height = 90 + headerHeight + rowHeights.reduce((sum, h) => sum + h, 0) + 40;
  const scale = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const canvas = document.createElement('canvas');
  canvas.width = width * scale;
  canvas.height = height * scale;
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  const bg = canvasCssColor('--bg', '#0b0c10');
  const surface = canvasCssColor('--surface', '#1f2833');
  const surface2 = canvasCssColor('--surface-2', '#2a3542');
  const ink = canvasCssColor('--ink', '#c5c6c7');
  const muted = canvasCssColor('--muted', '#8899a6');
  const border = canvasCssColor('--border', '#2a3542');
  const gold = canvasCssColor('--gold', '#feca57');
  const goldBg = canvasCssColor('--gold-bg', 'rgba(254,202,87,0.16)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = ink;
  ctx.font = '700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText('Coordination Matrix', 28, 38);
  ctx.font = '13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillStyle = muted;
  ctx.fillText(`${matrixPhaseMode} • ${matrixHideRoutine ? 'routine hidden' : 'routine visible'} • ${matrixStrictMode ? 'favorites and risks only' : 'coordination signals'}`, 28, 62);
  let y = 90;
  ctx.fillStyle = surface2;
  ctx.fillRect(0, y, width, headerHeight);
  ctx.strokeStyle = border;
  ctx.strokeRect(0, y, width, headerHeight);
  ctx.fillStyle = ink;
  ctx.font = '700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText('Workstream', 18, y + 33);
  ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillStyle = muted;
  ctx.fillText('Enabled products', 18, y + 53);
  phases.forEach((phase, idx) => {
    const x = workstreamWidth + idx * phaseWidth;
    const current = isCurrentMatrixPhase(phase);
    ctx.fillStyle = current ? goldBg : surface2;
    ctx.fillRect(x, y, phaseWidth, headerHeight);
    ctx.strokeStyle = border;
    ctx.strokeRect(x, y, phaseWidth, headerHeight);
    ctx.fillStyle = current ? gold : ink;
    ctx.font = '700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillText(phase.label, x + 14, y + 33);
    ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = muted;
    wrapCanvasText(ctx, phase.desc || '', phaseWidth - 28, 2).forEach((line, lineIdx) => ctx.fillText(line, x + 14, y + 54 + (lineIdx * 16)));
    if (current) {
      ctx.strokeStyle = gold;
      ctx.strokeRect(x + 14, y + 78, 68, 22);
      ctx.fillStyle = gold;
      ctx.font = '700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillText('CURRENT', x + 23, y + 93);
    }
  });
  y += headerHeight;
  groups.forEach((group, groupIdx) => {
    const rowHeight = rowHeights[groupIdx];
    ctx.fillStyle = surface;
    ctx.fillRect(0, y, width, rowHeight);
    ctx.strokeStyle = border;
    ctx.strokeRect(0, y, width, rowHeight);
    ctx.fillStyle = ink;
    ctx.font = '700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    wrapCanvasText(ctx, group.label, workstreamWidth - 32, 3).forEach((line, lineIdx) => ctx.fillText(line, 18, y + 32 + (lineIdx * 18)));
    ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = muted;
    ctx.fillText(productName(group.doc), 18, y + rowHeight - 22);
    phases.forEach((phase, idx) => {
      const x = workstreamWidth + idx * phaseWidth;
      const current = isCurrentMatrixPhase(phase);
      ctx.fillStyle = current ? goldBg : surface;
      ctx.fillRect(x, y, phaseWidth, rowHeight);
      ctx.strokeStyle = border;
      ctx.strokeRect(x, y, phaseWidth, rowHeight);
      const groupedItems = groupMatrixCellItems(group.phases.get(phase.label) || []);
      if (!groupedItems.length) {
        ctx.fillStyle = muted;
        ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillText('No promoted items', x + 14, y + 32);
        return;
      }
      groupedItems.forEach((itemGroup, itemIdx) => {
        const cardY = y + 14 + itemIdx * 62;
        const product = productColor(itemGroup.doc);
        ctx.fillStyle = surface2;
        drawRoundRect(ctx, x + 12, cardY, phaseWidth - 24, 52, 8);
        ctx.fill();
        ctx.fillStyle = product;
        ctx.fillRect(x + 12, cardY, 4, 52);
        ctx.fillStyle = ink;
        ctx.font = '700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        wrapCanvasText(ctx, `${itemGroup.del.favorite ? '★ ' : ''}${itemGroup.del.title}`, phaseWidth - 42, 1).forEach(line => ctx.fillText(line, x + 24, cardY + 20));
        ctx.fillStyle = muted;
        ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        const dateText = itemGroup.items.length === 1 ? (itemGroup.items[0].dueDate ? dueDateValue(itemGroup.items[0].dueDate) : itemGroup.del.end || itemGroup.del.start || 'No date') : `${itemGroup.items.length} due dates`;
        ctx.fillText(`${dateText} • ${statusLabel(itemGroup.status)}`, x + 24, cardY + 38);
      });
    });
    y += rowHeight;
  });
  ctx.fillStyle = muted;
  ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText(`Generated ${new Date().toISOString()}`, 28, height - 18);
  const link = document.createElement('a');
  link.href = canvas.toDataURL('image/png');
  link.download = `roadmap-matrix-${new Date().toISOString().slice(0, 10)}.png`;
  link.click();
}

function renderD3Timeline() {
  const wrap = $('#roadmapWrap');
  const body = $('#roadmapBody');
  wrap.classList.remove('linear-wrap', 'matrix-wrap');
  wrap.classList.add('d3-wrap');
  const items = collectDueItems().filter(item => item.parsed);
  const fullDomain = timelineDateDomain(items);
  const domain = timelineVisibleDomain(fullDomain);
  const tagLabel = selectedTagFilter ? `Tag: #${escapeHtml(selectedTagFilter)}` : 'All visible tags';
  $('#timelineHeader').innerHTML = `<div class="d3-timeline-toolbar"><div><span class="d3-timeline-title">Timeline</span> • ${tagLabel} • ${escapeHtml(timelineWindowLabel(domain))}</div><div class="d3-timeline-actions"><button class="btn small" type="button" data-timeline-pan="prev" ${timelineWindow === 'all' ? 'disabled' : ''}>← Earlier</button><button class="btn small" type="button" data-timeline-pan="next" ${timelineWindow === 'all' ? 'disabled' : ''}>Later →</button><span>${timelineGrouping === 'product' ? 'Grouped by product' : 'Unified stream'}</span></div></div>`;
  $('#timelineHeader').querySelectorAll('[data-timeline-pan]').forEach(btn => btn.addEventListener('click', e => shiftTimelineWindow(e.currentTarget.dataset.timelinePan === 'next' ? 1 : -1, fullDomain)));
  body.innerHTML = '';
  if (!enabledDocuments().length) {
    body.innerHTML = renderNoDocumentsActions();
    attachNoDocumentsActions();
    renderStats();
    return;
  }
  if (!items.length) {
    body.innerHTML = '<div class="timeline-empty">No dated roadmap items match the current tag and filters.</div>';
    renderStats();
    return;
  }
  const visibleItems = items.filter(item => item.parsed >= domain[0] && item.parsed < domain[1]);
  const baseWidth = wrap.clientWidth || 920;
  const width = Math.max(1100, baseWidth, (timelineWindow === 'month' ? 2600 : timelineWindow === 'quarter' ? 2200 : timelineWindow === 'year' ? 1800 : 1100));
  const margin = { top: 42, right: 34, bottom: 42, left: timelineGrouping === 'product' ? 154 : 34 };
  const rowHeight = 62;
  const lanePadding = 72;
  const x = d3Timeline.scaleTime(domain, [margin.left, width - margin.right]);
  const groups = groupTimelineItems(visibleItems).map(group => layoutTimelineItems(group, x, width, margin));
  const groupOffsets = [];
  let runningOffset = margin.top + 48;
  groups.forEach(group => {
    groupOffsets.push(runningOffset);
    runningOffset += lanePadding + (group.layoutRows * rowHeight);
  });
  const height = runningOffset + margin.bottom;
  const svg = d3Timeline.create('svg', { class: 'd3-timeline-svg', viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': 'Roadmap timeline view' });
  const axis = d3Timeline.create('g', { class: 'timeline-axis' });
  const startYear = domain[0].getFullYear();
  const endYear = domain[1].getFullYear();
  for (let y = startYear; y <= endYear; y++) {
    [0, 3, 6, 9].forEach(month => {
      const d = new Date(y, month, 1);
      if (d < domain[0] || d > domain[1]) return;
      const px = x(d);
      axis.appendChild(d3Timeline.create('line', { x1: px, x2: px, y1: margin.top - 16, y2: height - margin.bottom + 10 }));
      const text = d3Timeline.create('text', { x: px + 4, y: 20 });
      text.textContent = `${MONTH_NAMES[month]} ${y}`;
      axis.appendChild(text);
    });
  }
  svg.appendChild(axis);
  const todayX = x(new Date());
  if (todayX >= margin.left && todayX <= width - margin.right) svg.appendChild(d3Timeline.create('line', { class: 'timeline-today', x1: todayX, x2: todayX, y1: margin.top - 20, y2: height - margin.bottom + 10 }));
  groups.forEach((group, groupIdx) => {
    const laneY = groupOffsets[groupIdx];
    svg.appendChild(d3Timeline.create('line', { class: 'timeline-lane-line', x1: margin.left, x2: width - margin.right, y1: laneY, y2: laneY }));
    const label = d3Timeline.create('text', { class: 'timeline-group-label', x: 16, y: laneY + 4 });
    label.textContent = group.label;
    svg.appendChild(label);
    group.items.forEach(item => {
      const xPos = item.xPos;
      const yPos = laneY + (item.layoutRow * rowHeight);
      const status = dueDateStatus(item.dueDate, item.del);
      const node = d3Timeline.create('g', { class: `timeline-node ${statusClass(status)}`, tabindex: '0', role: 'button', 'aria-label': `${item.del.title} due ${dueDateValue(item.dueDate)}` });
      node.appendChild(d3Timeline.create('circle', { class: 'timeline-node-dot', cx: xPos, cy: yPos, r: 8, fill: productColor(item.doc) }));
      node.appendChild(d3Timeline.create('rect', { class: 'timeline-node-card', x: xPos + 12, y: yPos - 22, width: 148, height: 44 }));
      const title = d3Timeline.create('text', { class: 'timeline-node-title', x: xPos + 22, y: yPos - 5 });
      title.textContent = item.del.title.length > 24 ? `${item.del.title.slice(0, 23)}…` : item.del.title;
      node.appendChild(title);
      const meta = d3Timeline.create('text', { class: 'timeline-node-meta', x: xPos + 22, y: yPos + 12 });
      meta.textContent = `${dueDateValue(item.dueDate)} • ${productName(item.doc)} • ${statusLabel(status)}`;
      node.appendChild(meta);
      node.addEventListener('click', () => openDetail(item.del, item.doc, item.dueDate));
      node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(item.del, item.doc, item.dueDate); } });
      svg.appendChild(node);
    });
  });
  const scrollCanvas = document.createElement('div');
  scrollCanvas.className = 'timeline-scroll-canvas';
  const canvas = document.createElement('div');
  canvas.className = 'd3-timeline-canvas';
  canvas.style.width = `${width}px`;
  canvas.appendChild(svg);
  scrollCanvas.appendChild(canvas);
  body.appendChild(scrollCanvas);
  renderStats();
}

      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveStatusChange(); }
    });
  });
}

function saveStatusChange() {
  if (!selectedDeliverable || !selectedDocument) return;
  const note = ($('#statusNote').value || '').trim();
  selectedDeliverable.tags = normalizeTags($('#taskTags')?.value || '');
  selectedDeliverable.favorite = Boolean($('#taskFavorite')?.checked);
  if (selectedDueDate) {
    selectedDueDate.status = selectedStatus;
    selectedDueDate.note = note;
    const actionName = ($('#newActionName')?.value || '').trim();
    const actionNote = ($('#newActionNote')?.value || '').trim();
    if (actionName || actionNote) {
      if (!Array.isArray(selectedDueDate.actions)) selectedDueDate.actions = [];
      selectedDueDate.actions.push({ name: actionName, note: actionNote, timestamp: getEasternTimestamp() });
    }
  } else {
    const oldStatus = selectedDeliverable.status;
    selectedDeliverable.status = selectedStatus;
    if (!Array.isArray(selectedDeliverable.notes)) selectedDeliverable.notes = [];
    if (note || oldStatus !== selectedStatus) selectedDeliverable.notes.push(`${new Date().toISOString()} | ${selectedStatus} | ${note || `Status changed from ${oldStatus} to ${selectedStatus}`}`);
  }
  touchDocument(selectedDocument);
  saveCache();
  renderRoadmap();
  closeDetail();
}

function openEditor() {
  const cards = DOCUMENTS.map((doc, i) => `
    <div class="doc-card" data-doc-card="${i}">
      <div class="doc-card-header">
        <label class="doc-card-title"><input type="checkbox" ${doc.enabled ? 'checked' : ''} data-edit-enabled="${i}"> ${escapeHtml(productName(doc))}</label>
        <div class="doc-actions">
          <button class="btn small active" data-add-deliverable="${i}">Add Deliverable</button>

        </div>
      </div>
      <div class="doc-summary">${(doc.data.deliverables || []).length} deliverable${(doc.data.deliverables || []).length === 1 ? '' : 's'} &bull; Owner: ${escapeHtml(doc.data.owner || 'Not set')} &bull; Color: ${escapeHtml(productColor(doc))}</div>
      <div class="product-color-control">
        <label>Product Color</label>
        <div class="color-swatch-row">${DEFAULT_PRODUCT_COLORS.map(color => `<button type="button" class="color-swatch${productColor(doc) === color ? ' active' : ''}" style="--swatch-color:${color}" data-color-swatch="${i}" data-color-value="${color}" aria-label="Use product color ${color}"></button>`).join('')}</div>
        <div class="hex-input-row"><input type="color" value="${escapeHtml(productColor(doc))}" data-product-color-native="${i}" aria-label="Product color picker"><input type="text" value="${escapeHtml(productColor(doc))}" data-product-color="${i}" aria-label="Hex code" placeholder="#3b82f6"></div>
        <div class="help-text" style="margin-top:0.4rem">Pick a default color or enter a 6-digit hex code.</div>
      </div>
      <div class="json-editor" data-json-editor="${i}">
        <textarea class="editable" data-doc-json="${i}">${escapeHtml(JSON.stringify(doc.data, null, 2))}</textarea>
      </div>
    </div>`).join('');
  openPanel('Edit Product JSON Documents', `
    <div class="field"><label>Products</label><div class="help-text">Each card is an independent product roadmap JSON document. JSON is collapsed by default; click Edit JSON only when you need raw data changes.</div></div>
    ${cards || '<div class="empty-state">No product JSON documents yet.</div>'}
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1rem">
      <button class="btn active" id="btnSaveJson">Save & Render</button>
      <button class="btn" id="btnCancelEditor">Cancel</button>
      <button class="btn" id="btnAddDoc">Add Product JSON</button>
      <button class="btn" id="btnLoadJson">Load JSON Document</button>
      <input id="jsonFileInput" type="file" accept="application/json,.json" multiple hidden>
      <button class="btn" id="btnDownloadEnabled">Download Enabled JSONs</button>
      <button class="btn" id="btnDownloadAll">Download All JSONs</button>
      <button class="btn danger" id="btnClearCacheDrawer">Clear Cache</button>
    </div>
    <div class="field" style="margin-top:1rem"><label>Format</label><div class="value help-text">Paste one product object per card, or click Load JSON Document to import one or more .json files. Timeline dates use "Mon YYYY" (e.g. "Jun 2027"). Optional product fields: "order" number controls product display order, and "color" stores a hex product color such as "#3b82f6". Due dates use objects: { "date": "06/15/2026", "status": "in-progress", "note": "...", "actions": [{ "name": "Follow up", "note": "Owner confirmed scope.", "timestamp": "2026-05-12 14:30:00 ET" }] }. Optional task fields: "tags" as an array or comma-separated string, and "favorite": true. Legacy string due dates are migrated automatically.</div></div>
  `);
  document.querySelectorAll('[data-add-deliverable]').forEach(btn => btn.addEventListener('click', e => {
    const idx = Number(e.currentTarget.dataset.addDeliverable);
    if (!saveEditorDocuments(false)) return;
    openAddDeliverable(idx);
  }));
  document.querySelectorAll('[data-edit-json]').forEach(btn => btn.addEventListener('click', e => {
    const idx = Number(e.currentTarget.dataset.editJson);
    const editor = document.querySelector(`[data-json-editor="${idx}"]`);
    const isOpen = editor?.classList.toggle('open');
    e.currentTarget.textContent = isOpen ? 'Hide JSON' : 'Edit JSON';
    e.currentTarget.setAttribute('aria-expanded', String(Boolean(isOpen)));
    if (isOpen) editor.querySelector('textarea')?.focus();
  }));
  document.querySelectorAll('[data-color-swatch]').forEach(btn => btn.addEventListener('click', e => {
    const idx = Number(e.currentTarget.dataset.colorSwatch);
    const color = normalizeProductColor(e.currentTarget.dataset.colorValue);
    const textInput = document.querySelector(`[data-product-color="${idx}"]`);
    const nativeInput = document.querySelector(`[data-product-color-native="${idx}"]`);
    if (textInput) textInput.value = color;
    if (nativeInput) nativeInput.value = color;
    document.querySelectorAll(`[data-color-swatch="${idx}"]`).forEach(swatch => swatch.classList.toggle('active', swatch.dataset.colorValue === color));
  }));
  document.querySelectorAll('[data-product-color-native]').forEach(input => input.addEventListener('input', e => {
    const idx = Number(e.currentTarget.dataset.productColorNative);
    const textInput = document.querySelector(`[data-product-color="${idx}"]`);
    if (textInput) textInput.value = normalizeProductColor(e.currentTarget.value);
  }));
  document.querySelectorAll('[data-product-color]').forEach(input => input.addEventListener('input', e => {
    const idx = Number(e.currentTarget.dataset.productColor);
    const color = normalizeProductColor(e.currentTarget.value, '');
    const nativeInput = document.querySelector(`[data-product-color-native="${idx}"]`);
    if (color && nativeInput) nativeInput.value = color;
    document.querySelectorAll(`[data-color-swatch="${idx}"]`).forEach(swatch => swatch.classList.toggle('active', swatch.dataset.colorValue === color));
  }));
  document.querySelectorAll('[data-download-doc]').forEach(btn => btn.addEventListener('click', e => {
    const doc = DOCUMENTS[Number(e.target.dataset.downloadDoc)];
    downloadJson(doc.data, `${slugify(productName(doc))}.json`);
  }));
  document.querySelectorAll('[data-remove-doc]').forEach(btn => btn.addEventListener('click', e => {
    const idx = Number(e.target.dataset.removeDoc);
    if (!confirm(`Remove ${productName(DOCUMENTS[idx])} from this local roadmap set?`)) return;
    DOCUMENTS.splice(idx, 1);
    saveCache();
    renderRoadmap();
    openEditor();
  }));
  $('#btnSaveJson').addEventListener('click', () => saveEditorDocuments());
  $('#btnCancelEditor').addEventListener('click', closeDetail);
  $('#btnAddDoc').addEventListener('click', addProductDocument);
  $('#btnLoadJson').addEventListener('click', () => $('#jsonFileInput').click());
  $('#jsonFileInput').addEventListener('change', loadJsonDocumentsFromFiles);
  $('#btnDownloadEnabled').addEventListener('click', () => downloadJson({ documents: enabledDocuments() }, 'enabled-product-roadmaps.json'));
  $('#btnDownloadAll').addEventListener('click', () => downloadJson({ documents: DOCUMENTS }, 'all-product-roadmaps.json'));
  $('#btnClearCacheDrawer').addEventListener('click', clearCache);
}

function saveEditorDocuments(reopen = true) {
  const next = [];
  const seenIds = new Set();
  try {
    document.querySelectorAll('[data-doc-json]').forEach(textarea => {
      const idx = Number(textarea.dataset.docJson);
      const parsed = JSON.parse(textarea.value);
      if (Array.isArray(parsed)) throw new Error(`Product card ${idx + 1} must contain one product object, not an array.`);
      parsed.color = normalizeProductColor(document.querySelector(`[data-product-color="${idx}"]`)?.value, DEFAULT_PRODUCT_COLORS[idx % DEFAULT_PRODUCT_COLORS.length]);
      const doc = normalizeDocument({
        id: DOCUMENTS[idx]?.id,
        enabled: document.querySelector(`[data-edit-enabled="${idx}"]`)?.checked !== false,
        data: parsed
      }, idx);
      if (seenIds.has(doc.id)) doc.id = `${doc.id}-${idx + 1}`;
      seenIds.add(doc.id);
      touchDocument(doc);
      next.push(doc);
    });
    DOCUMENTS = next;
    saveCache();
    renderRoadmap();
    if (reopen) openEditor();
    return true;
  } catch(e) {
    alert('Invalid JSON: ' + e.message);
    return false;
  }
}
function ensureUniqueDocumentIds(docs) {
  const seen = new Set();
  return docs.map((doc, idx) => {
    const base = doc.id || slugify(productName(doc) || `roadmap-${idx + 1}`);
    let id = base;
    let suffix = 2;
    while (seen.has(id)) id = `${base}-${suffix++}`;
    seen.add(id);
    return { ...doc, id };
  });
}
function addProductDocument(fromEditor = true) {
  if (fromEditor && !saveEditorDocuments(false)) return;
  DOCUMENTS.push(normalizeDocument({ project: 'New Product', title: 'Product Roadmap', subtitle: 'Interactive Deliverables & Timeline', owner: 'Product Team', order: DOCUMENTS.length + 1, color: DEFAULT_PRODUCT_COLORS[DOCUMENTS.length % DEFAULT_PRODUCT_COLORS.length], deliverables: [] }, DOCUMENTS.length));
  DOCUMENTS = ensureUniqueDocumentIds(DOCUMENTS);
  saveCache();
  renderRoadmap();
  openEditor();
}
function nextDeliverableId(doc) {
  const alpha = slugify(productName(doc)).replace(/[^a-z]/g, '');
  const prefix = (alpha.slice(0, 2) || 'rd').padEnd(2, 'd');
  const existing = new Set((doc.data.deliverables || []).map(d => d.id));
  let i = (doc.data.deliverables || []).length + 1;
  let id = `${prefix}-${String(i).padStart(3, '0')}`;
  while (existing.has(id)) id = `${prefix}-${String(++i).padStart(3, '0')}`;
  return id;
}
function openAddDeliverable(docIndex) {
  const doc = DOCUMENTS[docIndex];
  if (!doc) { openEditor(); return; }
  const currentMonth = getCurrentMonthKey();
  openPanel(`Add Deliverable — ${productName(doc)}`, `
    <div class="field"><label>Product / Contract</label><div class="value">${escapeHtml(productName(doc))}</div></div>
    <div class="form-grid">
      <div class="field span-2"><label>Task</label><input id="newDelTitle" type="text" placeholder="Deliverable title"></div>
      <div class="field"><label>Due Date</label><input id="newDelDueDate" type="text" placeholder="MM/DD/YYYY"></div>
      <div class="field"><label>Status</label><select id="newDelStatus">${supportedStatuses().map(s => `<option value="${s}">${statusLabel(s)}</option>`).join('')}</select></div>
      <div class="field"><label>Owner</label><input id="newDelOwner" type="text" value="${escapeHtml(doc.data.owner || '')}" placeholder="Owner"></div>
      <div class="field"><label>Favorite</label><label class="toggle-pill"><input id="newDelFavorite" type="checkbox"> Favorite task</label></div>
      <div class="field span-2"><label>Tags</label><input id="newDelTags" type="text" placeholder="Comma-separated tags"></div>
      <div class="field"><label>Start Month</label><input id="newDelStart" type="text" value="${escapeHtml(currentMonth)}" placeholder="Mon YYYY"></div>
      <div class="field"><label>End Month</label><input id="newDelEnd" type="text" value="${escapeHtml(currentMonth)}" placeholder="Mon YYYY"></div>
      <div class="field span-2"><label>Description</label><textarea id="newDelDesc" rows="4" placeholder="Optional description or acceptance criteria..."></textarea></div>
    </div>
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1rem">
      <button class="btn active" id="btnSaveNewDeliverable">Add Deliverable</button>
      <button class="btn" id="btnBackToEditor">Back to JSON Editor</button>
    </div>
    <div class="field" style="margin-top:1rem"><div class="help-text">This appends a normalized deliverable to the selected product JSON. You can fine-tune the raw JSON afterward from Edit Data.</div></div>
  `);
  $('#btnBackToEditor').addEventListener('click', openEditor);
  $('#btnSaveNewDeliverable').addEventListener('click', () => saveNewDeliverable(docIndex));
}
function saveNewDeliverable(docIndex) {
  const doc = DOCUMENTS[docIndex];
  if (!doc) { openEditor(); return; }
  const title = ($('#newDelTitle').value || '').trim();
  if (!title) { alert('Task title is required.'); return; }
  const dueDateText = ($('#newDelDueDate').value || '').trim();
  const dueDate = dueDateText ? normalizeDueDate({ date: dueDateText, status: $('#newDelStatus').value || 'not-started', note: '' }, $('#newDelStatus').value || 'not-started') : null;
  const dueMonth = dueDate ? monthKeyFromDueDate(dueDate) : null;
  const defaultMonth = getCurrentMonthKey();
  const startValue = ($('#newDelStart').value || '').trim();
  const endValue = ($('#newDelEnd').value || '').trim();
  const start = dueMonth && startValue === defaultMonth ? dueMonth : (startValue || dueMonth || defaultMonth);
  const end = dueMonth && endValue === defaultMonth ? dueMonth : (endValue || dueMonth || start);
  const deliverable = {
    id: nextDeliverableId(doc),
    title,
    owner: ($('#newDelOwner').value || doc.data.owner || '').trim(),
    status: $('#newDelStatus').value || 'not-started',
    start,
    end,
    desc: ($('#newDelDesc').value || '').trim(),
    tags: normalizeTags($('#newDelTags').value || ''),
    favorite: Boolean($('#newDelFavorite')?.checked),
    dueDates: dueDate ? [dueDate] : [],
    notes: []
  };
  if (!Array.isArray(doc.data.deliverables)) doc.data.deliverables = [];
  doc.data.deliverables.push(deliverable);
  touchDocument(doc);
  saveCache();
  renderRoadmap();
  openDetail(deliverable, doc, deliverable.dueDates[0] || null);
}
async function loadJsonDocumentsFromFiles(event) {
  const input = event.target;
  const files = Array.from(input.files || []);
  if (!files.length) return;
  if (!saveEditorDocuments(false)) { input.value = ''; return; }
  try {
    const imported = [];
    for (const file of files) {
      const text = await file.text();
      const parsed = JSON.parse(text);
      imported.push(...normalizeDocuments(parsed));
    }
    if (!imported.length) throw new Error('No roadmap documents found in selected file(s).');
    DOCUMENTS = ensureUniqueDocumentIds([...DOCUMENTS, ...imported]);
    saveCache();
    renderRoadmap();
    openEditor();
  } catch(e) {
    alert('Unable to load JSON document: ' + e.message);
  } finally {
    input.value = '';
  }
}

function downloadJson(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function clearCache() {
  if (!confirm('Clear localStorage cache and reset to embedded defaults?')) return;
  localStorage.removeItem(STORAGE_KEY);
  DOCUMENTS = deepClone(DEFAULT_DOCUMENTS);
  renderRoadmap();
  closeDetail();
}

$('#globalJsonFileInput').addEventListener('change', loadJsonDocumentsFromFiles);
$('#btnClose').addEventListener('click', closeDetail);
$('#overlay').addEventListener('click', closeDetail);
$('#btnNow').addEventListener('click', () => {
  if ($('#btnNow').disabled || currentView === 'grid') return;
  if (currentView === 'linear') {
    const current = document.querySelector('.linear-row.current-week');
    if (current) current.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (currentView === 'timeline') {
    const today = document.querySelector('.timeline-today');
    if (today) today.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    return;
  }
  const idx = monthIndex(getCurrentMonthKey());
  if (idx < 0) return;
  const wrap = $('#roadmapWrap');
  const monthWidth = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--month-col')) || 55;
  const nameWidth = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--name-col')) || 240;
  wrap.scrollTo({ left: nameWidth + (monthWidth * idx) - (wrap.clientWidth / 2) + (monthWidth / 2), behavior: 'smooth' });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

applyTheme(currentTheme);
renderRoadmap();
</script>
